name: Weekly R3 Reporting

on:
  push:
    branches:
      - feat/weekly-challenge-r3

permissions:
  contents: write

jobs:
  report-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/weekly-challenge-r3
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Weekly reporting
        run: python .github/scripts/apply_weekly_r3_reporting.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated reporting
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add src/analytics/TelemetrySummary.ts scripts/soft-launch-report.mjs
          git commit -m "feat: report weekly challenge replay funnel"
          git push origin HEAD:feat/weekly-challenge-r3
