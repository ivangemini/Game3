name: Daily Challenge Isolation

on:
  push:
    branches: [fix/challenges-daily-progress-isolation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/challenges-daily-progress-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/fix_daily_challenge_isolation.py
      - run: rm .github/scripts/fix_daily_challenge_isolation.py .github/workflows/daily-challenge-isolation.yml
      - run: git diff --check
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate Daily challenge progress from other runs"
          git push origin HEAD:fix/challenges-daily-progress-isolation
