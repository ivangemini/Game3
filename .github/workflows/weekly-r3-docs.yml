name: Weekly R3 Docs Closure

on:
  push:
    branches: [feat/weekly-challenge-r3]

permissions:
  contents: write

jobs:
  close-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weekly-challenge-r3
          fetch-depth: 0
      - run: python .github/scripts/close_weekly_r3_docs.py
      - run: rm .github/scripts/close_weekly_r3_docs.py .github/workflows/weekly-r3-docs.yml
      - run: git diff --check
      - run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "docs: close retention R3 weekly challenge"
          git push origin HEAD:feat/weekly-challenge-r3
