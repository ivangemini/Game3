name: Update audio contract assertions

on:
  push:
    branches: [polish/presentation-ux-gamefeel-pass]
    paths: ['.github/workflows/update-audio-contract.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update boss telegraph priority assertions
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/closetMonster.test.ts tests/deadlineSnail.test.ts tests/loopBossFamilies.test.ts tests/tagEclipseAudio.test.ts)
          for file in "${files[@]}"; do
            sed -i "s/telegraph', priority: 3/telegraph', priority: 4/g" "$file"
          done
          git rm .github/workflows/update-audio-contract.yml
          git add "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align boss telegraph audio priority"
          git push
