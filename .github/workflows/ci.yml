name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run assets:prepare
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run release:check
      - run: npm run release:archive
      - run: npm run release:verify
      - name: Upload portal candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: junkpack-portal-candidate
          path: release/
          retention-days: 14

  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload portal screenshots
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: junkpack-portal-screenshots
          path: portal-screenshot-*.png
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
