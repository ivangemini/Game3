name: Late World Event Affinity

on:
  push:
    branches:
      - feat/late-world-event-affinity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/late-world-event-affinity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply late-world event affinity
        run: python .github/scripts/apply_late_world_event_affinity.py

      - name: Remove temporary integration files
        run: rm .github/scripts/apply_late_world_event_affinity.py .github/workflows/late-world-event-affinity.yml

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated feature
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: bias late-world events by district identity"
          git push origin HEAD:feat/late-world-event-affinity
