name: Late Boss Phase Two

on:
  push:
    branches:
      - feat/late-boss-phase-two

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/late-boss-phase-two
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply phase two
        run: python .github/scripts/apply_late_boss_phase_two.py
      - name: Remove temporary integration files
        run: rm .github/scripts/apply_late_boss_phase_two.py .github/workflows/late-boss-phase-two.yml
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit validated feature
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: escalate late campaign boss mechanics"
          git push origin HEAD:feat/late-boss-phase-two
