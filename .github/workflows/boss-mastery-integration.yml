name: Boss Mastery Integration

on:
  push:
    branches:
      - feat/boss-mastery-challenges

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/boss-mastery-challenges
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integration patch
        run: python .github/scripts/apply_boss_mastery_integration.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated integration
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete boss mastery counterplay challenges"
          git push origin HEAD:feat/boss-mastery-challenges
