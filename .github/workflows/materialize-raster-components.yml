name: Materialize raster component art
on:
  push:
    branches: [polish/presentation-ux-gamefeel-pass]
    paths:
      - '.agent-raster-components.patch'
      - '.github/workflows/materialize-raster-components.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/presentation-ux-gamefeel-pass
          fetch-depth: 0
      - name: Apply raster component patch
        run: |
          git apply --3way .agent-raster-components.patch
          rm .agent-raster-components.patch .github/workflows/materialize-raster-components.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rasterize backpack and TV Tyrant presentation'
          git push origin HEAD:polish/presentation-ux-gamefeel-pass
