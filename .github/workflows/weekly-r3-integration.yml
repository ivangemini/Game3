name: Weekly R3 Integration

on:
  push:
    branches:
      - feat/weekly-challenge-r3

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/weekly-challenge-r3
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply runtime integration
        run: |
          python .github/scripts/apply_weekly_r3_runtime.py
          python - <<'PY'
          from pathlib import Path
          weekly = Path('src/game/ui/WeeklyChallengeOverlay.ts')
          weekly.write_text(weekly.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          daily = Path('src/game/ui/DailyBoardOverlay.ts')
          text = daily.read_text(encoding='utf-8')
          text = text.replace("'Today's deterministic run is active.'", '"Today\'s deterministic run is active."')
          text = text.replace("'Starts today's seed and replaces the current run.'", '"Starts today\'s seed and replaces the current run."')
          daily.write_text(text, encoding='utf-8')
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated runtime integration
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add src services
          git commit -m "feat: integrate weekly challenge runtime and persistence"
          git push origin HEAD:feat/weekly-challenge-r3
