name: Release Acceptance Evidence

on:
  push:
    branches:
      - feat/release-acceptance-evidence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-acceptance-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply documentation integration
        run: python .github/scripts/apply_release_acceptance_docs.py
      - name: Remove temporary integration files
        run: rm .github/scripts/apply_release_acceptance_docs.py .github/workflows/release-acceptance-evidence.yml
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Exercise acceptance CLI
        run: |
          npm run release:acceptance:template -- reports/acceptance-template.json
          set +e
          npm run release:acceptance:check -- reports/acceptance-template.json --out reports/acceptance-template.md
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'Status: \*\*INCOMPLETE\*\*' reports/acceptance-template.md
      - name: Commit validated tooling
        run: |
          git config user.name "game3-ci"
          git config user.email "game3-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: add structured release acceptance evidence"
          git push origin HEAD:feat/release-acceptance-evidence
